{% extends 'base.html' %}{% block crumb %}Chỉnh sửa giải nháp{% endblock %}{% block content %}
<div class="page-heading"><p class="eyebrow">ĐIỀU LỆ MÙA GIẢI</p><h1>Chỉnh sửa giải nháp</h1><p>Kiểm tra thông tin trước khi mở đăng ký. Điều lệ sẽ khóa khi giải được công bố.</p></div>
<section class="panel form-width"><form method="post">{{ csrf_field() }}
<label>Tên giải<input name="name" required maxlength="150" value="{{ event.name }}"></label>
<div class="form-grid"><label>Thể thức<select name="format"><option value="knockout" {{ 'selected' if event.format=='knockout' }}>Loại trực tiếp</option><option value="roundrobin" {{ 'selected' if event.format=='roundrobin' }}>Vòng tròn</option></select></label>
<label>Dự bị tối đa<select name="reserve_max">{% for n in range(3) %}<option {{ 'selected' if n==event.reserve_max }}>{{ n }}</option>{% endfor %}</select></label>
<label>Mở đăng ký (giờ Việt Nam)<input name="opens" type="datetime-local" required value="{{ event.opens|localinput }}"></label><label>Đóng đăng ký (giờ Việt Nam)<input name="closes" type="datetime-local" required value="{{ event.closes|localinput }}"></label>
<label>Điểm thắng (vòng tròn)<input name="win_points" type="number" min="1" max="100" required value="{{ event.win_points }}"></label><label>Điểm thua (vòng tròn)<input name="loss_points" type="number" min="0" max="99" required value="{{ event.loss_points }}"></label><label>Quỹ thưởng (VND)<input name="pool" type="number" min="0" max="1000000000000" required value="{{ event.pool }}"></label></div>
<div class="actions"><button class="btn">Lưu điều lệ</button><a class="btn secondary" href="{{ url_for('event.detail',eid=event.id) }}">Quay lại giải</a></div></form></section>{% endblock %}
