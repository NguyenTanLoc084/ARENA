{% extends 'base.html' %}{% block crumb %}Thông báo{% endblock %}{% block content %}<div class="page-heading"><h1>Thông báo của bạn</h1></div><section class="panel"><form method="post">{{ csrf_field() }}<button class="btn secondary small">Đánh dấu tất cả đã đọc</button></form>{% for n in items %}<div class="list-row"><div><p>{{ n.message }}</p><small class="muted">{{ n.created|timevn }}</small></div>{% if not n.read %}<span class="badge open">Mới</span>{% endif %}</div>{% else %}<div class="empty">Chưa có thông báo.</div>{% endfor %}</section>{% endblock %}
