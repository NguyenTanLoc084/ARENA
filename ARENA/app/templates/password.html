{% extends 'base.html' %}{% block crumb %}Đổi mật khẩu{% endblock %}{% block content %}<div class="page-heading"><h1>Đổi mật khẩu</h1><p>Cập nhật mật khẩu cho tài khoản {{ g.user.username }}.</p></div><section class="panel"><form method="post" action="{{ url_for('auth.change_password') }}">{{ csrf_field() }}<label>Mật khẩu hiện tại<input type="password" name="old" required autocomplete="current-password"></label><label>Mật khẩu mới<input type="password" name="new" required minlength="8" maxlength="128" autocomplete="new-password"></label><label>Nhập lại mật khẩu mới<input type="password" name="confirm" required minlength="8" maxlength="128" autocomplete="new-password"></label><button class="btn">Đổi mật khẩu</button></form></section>{% endblock %}
