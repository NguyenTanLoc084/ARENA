{% extends 'base.html' %}{% block crumb %}Hồ sơ cá nhân{% endblock %}{% block content %}<div class="page-heading"><p class="eyebrow">THÔNG TIN TUYỂN THỦ</p><h1>Hồ sơ của bạn</h1><p>{{ profile.code }} · {{ profile.class_name }}</p></div><div class="two-cols"><section class="panel"><h2>Thông tin cá nhân</h2><form method="post">{{ csrf_field() }}<label>Họ và tên<input name="full_name" required value="{{ profile.full_name }}"></label><label>Tên trong game<input name="ign" required value="{{ profile.ign }}"></label><label>Ingame ID<input name="game_id" required value="{{ profile.game_id }}"></label><button class="btn">Lưu hồ sơ</button></form></section><section class="panel"><h2>Đổi mật khẩu</h2><form method="post" action="{{ url_for('auth.change_password') }}">{{ csrf_field() }}<label>Mật khẩu hiện tại<input type="password" name="old" required autocomplete="current-password"></label><label>Mật khẩu mới<input type="password" name="new" required minlength="8" autocomplete="new-password"></label><label>Nhập lại mật khẩu mới<input type="password" name="confirm" required minlength="8" autocomplete="new-password"></label><button class="btn secondary">Đổi mật khẩu</button></form></section></div>{% endblock %}
